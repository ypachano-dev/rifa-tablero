<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rifa 18 Pro Max">
<meta name="theme-color" content="#fbeedd">
<title>Rifa iPhone 18 Pro Max</title>
<style>
  :root { --safe: env(safe-area-inset-bottom, 0px); --parch:#fbeedd; --ink:#1a120c; --sold:#0a0a0a; --line:#c4a574; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#1a120c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--parch); padding-bottom: calc(76px + var(--safe)); }
  .flyer { background: var(--parch); }
  .flyer img.header, .flyer img.footer { width: 100%; display: block; user-select: none; pointer-events: none; }
  .grid-wrap { padding: 2px 4.5% 4px; background: var(--parch); }
  #grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 2px;
    background: #d8c4a0;
    border: 1.5px solid #b8955a;
    padding: 2px;
  }
  .cell {
    aspect-ratio: 1;
    border: none;
    margin: 0;
    padding: 0;
    background: #fdf6ea;
    color: var(--ink);
    font-weight: 700;
    font-size: clamp(0.65rem, 2.8vw, 0.95rem);
    font-variant-numeric: tabular-nums;
    border-radius: 1px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  .cell.sold { background: var(--sold); color: #fff; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-width: 430px; margin: 0 auto;
    display: flex; gap: 8px;
    padding: 10px 12px calc(10px + var(--safe));
    background: rgba(26,18,12,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .bar button {
    flex: 1; border: 0; border-radius: 14px; padding: 14px 8px;
    font-size: 0.95rem; font-weight: 700; cursor: pointer;
  }
  .bar .primary { background: #c9a227; color: #1a120c; }
  .bar .ghost { background: #3a2a1c; color: #fbeedd; }
  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: #1a120c; color: #fff; padding: 8px 14px; border-radius: 999px;
    font-size: 0.85rem; opacity: 0; transition: opacity .2s; z-index: 9;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .stats {
    text-align: center; font-size: 0.8rem; color: #5c4030;
    padding: 4px 8px 8px; background: var(--parch); font-weight: 600;
  }
</style>
</head>

<div class="bar">
  <button type="button" class="ghost" id="undo">Deshacer</button>
  <button type="button" class="primary" id="shot">Capturar y enviar</button>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY = 'rifa18pm_board_v2';
const INITIAL = [3, 6, 7, 8, 11, 13, 16, 17, 20, 21, 25, 27, 28, 31, 32, 33, 36, 41, 51, 52, 53, 54, 57, 58, 59, 60, 63, 66, 67, 75, 76, 77, 81, 82, 83, 86, 87, 88, 92, 93];
const grid = document.getElementById('grid');
const toast = document.getElementById('toast');
let sold = new Set();
let hist = [];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) sold = new Set(JSON.parse(raw));
    else sold = new Set(INITIAL);
  } catch(e) { sold = new Set(INITIAL); }
}
function save() { localStorage.setItem(KEY, JSON.stringify([...sold])); }
function pad(n) { return String(n).padStart(2,'0'); }
function tip(t) {
  toast.textContent = t; toast.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>toast.classList.remove('show'), 1400);
}
function stats() {
  document.getElementById('stats').textContent =
    sold.size + ' vendidos · ' + (100 - sold.size) + ' disponibles';
}
function render() {
  grid.innerHTML = '';
  for (let i = 0; i < 100; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell' + (sold.has(i) ? ' sold' : '');
    b.textContent = pad(i);
    b.addEventListener('click', () => toggle(i));
    grid.appendChild(b);
  }
  stats();
}
function toggle(n) {
  hist.push([...sold]);
  if (hist.length > 60) hist.shift();
  if (sold.has(n)) { sold.delete(n); tip('Nº ' + pad(n) + ' libre'); }
  else { sold.add(n); tip('Nº ' + pad(n) + ' vendido'); }
  save();
  const btn = grid.children[n];
  if (btn) btn.classList.toggle('sold', sold.has(n));
  stats();
}
document.getElementById('undo').onclick = () => {
  if (!hist.length) { tip('Nada que deshacer'); return; }
  sold = new Set(hist.pop()); save(); render(); tip('Deshecho');
};

async function capture() {
  tip('Generando…');
  const flyer = document.getElementById('flyer');
  const w = 621;
  const scale = 2;
  // Measure natural layout proportions from rendered flyer
  const header = flyer.querySelector('.header');
  const footer = flyer.querySelector('.footer');
  const gridEl = document.getElementById('grid');
  await Promise.all([header.decode?.() || Promise.resolve(), footer.decode?.() || Promise.resolve()]);

  const hw = header.naturalWidth || 621;
  const hh = header.naturalHeight || 455;
  const fw = footer.naturalWidth || 621;
  const fh = footer.naturalHeight || 165;
  const cell = 52;
  const gap = 3;
  const pad = 18;
  const gridSize = 10 * cell + 9 * gap;
  const gridBlock = gridSize + pad * 2;
  const statsH = 36;
  const H = hh + gridBlock + fh + statsH;
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#fbeedd';
  ctx.fillRect(0, 0, w, H);
  ctx.drawImage(header, 0, 0, w, hh);

  let y = hh;
  // grid background
  const gx = (w - gridSize) / 2 - 2;
  ctx.fillStyle = '#d8c4a0';
  ctx.fillRect(gx - 2, y + pad - 2, gridSize + 4, gridSize + 4);
  ctx.strokeStyle = '#b8955a';
  ctx.lineWidth = 2;
  ctx.strokeRect(gx - 2, y + pad - 2, gridSize + 4, gridSize + 4);

  for (let i = 0; i < 100; i++) {
    const c = i % 10, r = Math.floor(i / 10);
    const x = gx + c * (cell + gap);
    const yy = y + pad + r * (cell + gap);
    const is = sold.has(i);
    ctx.fillStyle = is ? '#0a0a0a' : '#fdf6ea';
    ctx.fillRect(x, yy, cell, cell);
    ctx.fillStyle = is ? '#ffffff' : '#1a120c';
    ctx.font = '700 18px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pad(i), x + cell / 2, yy + cell / 2 + 1);
  }
  y += gridBlock;
  ctx.drawImage(footer, 0, y, w, fh);
  y += fh;
  ctx.fillStyle = '#5c4030';
  ctx.font = '600 16px -apple-system, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(sold.size + ' vendidos · ' + (100 - sold.size) + ' disponibles', w / 2, y + 22);

  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  const file = new File([blob], 'rifa-18-pro-max.png', { type: 'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Rifa iPhone 18 Pro Max' });
      tip('Listo');
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rifa-18-pro-max.png';
  a.click();
  tip('Imagen guardada');
}
document.getElementById('shot').onclick = () => setTimeout(capture, 40);

load(); render();
</script>
</body>
